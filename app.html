<!DOCTYPE html>
<html lang="en" class="booting">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdnjs.cloudflare.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; frame-src https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal — Nexus OS</title>
<meta name="description" content="Your Nexus OS portal: job feed, application tracker, LeetCode and GitHub tracking, and the AI coach.">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M16 6l8 10-8 10-8-10z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=IBM+Plex+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="portal.css">
<script src="theme-boot.js"></script>
</head>
<body class="grain">
<a class="skip-link" href="#content">Skip to content</a>
<div class="ambient-top" aria-hidden="true"></div>
<div class="ambient-bottom" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<div class="scroll-progress" id="scrollProgress" aria-hidden="true"></div>

<div id="app" class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <a class="brand" href="index.html" title="Back to the landing page">
        <span class="brand-mark">◇</span>
        <div class="brand-text">
          <div class="brand-name">Nexus <em>OS</em></div>
          <div class="brand-sub">Engineering Grind</div>
        </div>
      </a>
      <button class="icon-btn sidebar-close" data-action="close-sidebar" aria-label="Close menu" data-ico="x" data-size="16"></button>
    </div>

    <div class="streak-box" id="streakBox">
      <span class="streak-flame" id="streakFlame"></span>
      <div>
        <div class="streak-num" id="streakNum">No streak yet</div>
        <div class="streak-sub" id="streakSub">Log practice to start</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Portal sections"></nav>

    <div class="sidebar-foot">
      <div class="today-bar">
        <div class="today-bar-head">
          <span>Today</span><span id="todayPct">0%</span>
        </div>
        <div class="progress"><div class="progress-fill" id="todayFill" style="width:0%"></div></div>
      </div>
      <div class="foot-row">
        <span class="sync-chip" id="syncChip">Not synced</span>
        <button class="icon-btn" data-action="cycle-theme" id="themeBtn" aria-label="Change theme" title="Theme"></button>
      </div>
      <button class="cloud-chip" id="cloudChip" data-action="nav" data-view="settings" type="button"></button>
      <div class="user-chip" id="userChip"></div>
    </div>
  </aside>

  <div class="scrim" data-action="close-sidebar"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="open-sidebar" aria-label="Open menu" data-ico="menu" data-size="16"></button>
      <div class="topbar-titles">
        <div class="topbar-eyebrow" id="pageEyebrow">Overview</div>
        <div class="topbar-title" id="pageTitle">Dashboard</div>
      </div>
      <div class="topbar-actions">
        <span class="today-date" id="todayDate"></span>
        <button class="btn btn-ghost" data-action="sync-all" id="syncBtn"><span data-ico="refresh" data-size="13"></span> Sync</button>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"></main>
    <footer class="foot-note"><span class="fn-mark">◇</span>nexus os · <span id="lastSyncNote">LeetCode/GitHub not synced yet</span> · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></footer>
  </div>
</div>

<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script src="firebase-config.js"></script>
<script src="icons.js"></script>
<script src="sri.js"></script>
<script src="auth-core.js"></script>
<script src="prompts.js"></script>
<script src="a11y.js"></script>
<script src="sync-engine.js"></script>
<script src="app.js"></script>
<script src="ai.js"></script>
<script src="profile.js"></script>
<script src="tracker.js"></script>
<script src="tracker-ui.js"></script>
<script src="sync.js"></script>
<script src="boot.js"></script>
</body>
</html>
